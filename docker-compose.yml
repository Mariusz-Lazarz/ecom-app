services:
  db:
    image: postgres:17-alpine
    container_name: ecom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom}
      POSTGRES_DB: ${POSTGRES_DB:-ecom}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for product photos. The app only speaks the S3 API, so
  # production can point the same env vars at AWS S3 or Cloudflare R2 instead.
  s3:
    image: adobe/s3mock:5
    container_name: ecom-s3
    restart: unless-stopped
    # The image runs as an unprivileged user that can't write to a fresh named volume.
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-northcart-media}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "${S3_PORT:-9090}:9090"
    volumes:
      - s3-data:/data

  # Catches every email the app sends locally (SMTP on 1025) and shows it in a web UI on 8025,
  # with an HTTP API the e2e tests read messages from. Nothing is delivered to real inboxes.
  mail:
    image: axllent/mailpit:latest
    container_name: ecom-mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
  s3-data:
