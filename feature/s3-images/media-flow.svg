<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="bold" fill="#0f172a">Upload (write path)</text>
  <text x="24" y="224" font-size="15" font-weight="bold" fill="#0f172a">Serving (read path)</text>

  <g font-size="13" fill="#0f172a">
    <rect x="24" y="52" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="109" y="78" text-anchor="middle" font-weight="bold">/dev/media form</text>
    <text x="109" y="98" text-anchor="middle" font-size="12" fill="#475569">file ≤ 10 MB</text>

    <rect x="236" y="52" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="321" y="78" text-anchor="middle" font-weight="bold">uploadMedia</text>
    <text x="321" y="98" text-anchor="middle" font-size="12" fill="#475569">Server Action, flag-gated</text>

    <rect x="448" y="44" width="250" height="140" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="573" y="68" text-anchor="middle" font-weight="bold">uploadImage (storage.ts)</text>
    <text x="462" y="92" font-size="12" fill="#334155">1. magic bytes: JPEG/PNG/WebP/AVIF</text>
    <text x="462" y="112" font-size="12" fill="#334155">2. sharp: rotate, fit 2000 px, ≤ 50 MP</text>
    <text x="462" y="132" font-size="12" fill="#334155">3. WebP q80, strip EXIF/GPS</text>
    <text x="462" y="152" font-size="12" fill="#334155">4. key = folder/sha256(bytes).webp</text>
    <text x="462" y="172" font-size="12" fill="#334155">5. PutObject, Cache-Control: immutable</text>

    <rect x="752" y="52" width="184" height="64" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="844" y="78" text-anchor="middle" font-weight="bold">S3 bucket</text>
    <text x="844" y="98" text-anchor="middle" font-size="12" fill="#475569">S3Mock · S3 / R2 in prod</text>

    <rect x="752" y="246" width="184" height="64" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="844" y="272" text-anchor="middle" font-weight="bold">MEDIA_PUBLIC_URL</text>
    <text x="844" y="292" text-anchor="middle" font-size="12" fill="#475569">CDN in front of the bucket</text>

    <rect x="448" y="246" width="250" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="573" y="272" text-anchor="middle" font-weight="bold">/_next/image optimiser</text>
    <text x="573" y="292" text-anchor="middle" font-size="12" fill="#475569">per-width WebP, cached 31 days</text>

    <rect x="236" y="246" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="321" y="272" text-anchor="middle" font-weight="bold">next/image</text>
    <text x="321" y="292" text-anchor="middle" font-size="12" fill="#475569">src = mediaUrl(key)</text>

    <rect x="24" y="246" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="109" y="272" text-anchor="middle" font-weight="bold">Browser</text>
    <text x="109" y="292" text-anchor="middle" font-size="12" fill="#475569">downloads its variant</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="194" y1="84" x2="234" y2="84" marker-end="url(#a)"/>
    <line x1="406" y1="84" x2="446" y2="84" marker-end="url(#a)"/>
    <line x1="698" y1="84" x2="750" y2="84" marker-end="url(#a)"/>
    <line x1="844" y1="116" x2="844" y2="244" marker-end="url(#a)"/>
    <line x1="750" y1="278" x2="700" y2="278" marker-end="url(#a)"/>
    <line x1="446" y1="278" x2="408" y2="278" marker-end="url(#a)"/>
    <line x1="234" y1="278" x2="196" y2="278" marker-end="url(#a)"/>
  </g>
  <text x="852" y="186" font-size="11" fill="#475569">public GET</text>
  <text x="24" y="360" font-size="12" fill="#475569">Next's local-IP guard is lifted only when MEDIA_PUBLIC_URL is localhost; remotePatterns allows only that host (plus Unsplash).</text>
</svg>
